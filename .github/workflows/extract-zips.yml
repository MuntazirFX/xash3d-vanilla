name: Extract ZIP Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract ZIPs into repo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show ZIP files
        run: |
          echo "=== ZIPs found ==="
          find . -name "*.zip" -not -path "./.git/*" 2>/dev/null

      - name: Install unzip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip

      - name: Extract "AetherEngine Claude.zip"
        run: |
          ZIP="AetherEngineclaude/AetherEngine Claude.zip"
          if [ -f "$ZIP" ]; then
            echo "Extracting: $ZIP"
            # Extract into the same folder, replacing the zip
            unzip -o "$ZIP" -d "AetherEngineclaude/"
            echo "✅ Extracted"
            echo ""
            echo "=== Contents ==="
            ls -la AetherEngineclaude/
          else
            echo "Not found: $ZIP"
          fi

      - name: Extract "AetherEngine file.zip"
        run: |
          ZIP="Aetherengine/AetherEngine file.zip"
          if [ -f "$ZIP" ]; then
            echo "Extracting: $ZIP"
            unzip -o "$ZIP" -d "Aetherengine/"
            echo "✅ Extracted"
            echo ""
            echo "=== Contents ==="
            ls -la Aetherengine/
          else
            echo "Not found: $ZIP"
          fi

      - name: Show result
        run: |
          echo "=== Final structure ==="
          find AetherEngineclaude Aetherengine -type f 2>/dev/null | head -50
          echo ""
          echo "=== Total files ==="
          find AetherEngineclaude Aetherengine -type f 2>/dev/null | wc -l

      - name: Commit extracted files
        run: |
          git config user.name  "XashFusion Bot"
          git config user.email "bot@xashfusion.local"
          git add -A
          git commit -m "Extract ZIP archives into repo" || echo "No changes to commit"
          git push
